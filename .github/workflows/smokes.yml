name: Backend Smokes

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  smokes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    env:
      # Vars usadas por smokes / API

      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          set -euxo pipefail
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break || true
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break || true
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      - name: Map host 'db' -> localhost (fix EAI_AGAIN)
        shell: bash
        run: |
          set -euxo pipefail
          echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          getent hosts db

      # ⚠️ Las migraciones se ejecutan en el host, no dentro de la red de Docker.
      # Muchos repos apuntan a HOST=db en .env/TypeORM; desde el runner eso no resuelve.
      # Forzamos el host a 127.0.0.1 para evitar EAI_AGAIN: db.
      - name: Run DB migrations (auto-detect)
        shell: bash
        env:
          DB_HOST: 127.0.0.1
          DATABASE_HOST: 127.0.0.1
          TYPEORM_HOST: 127.0.0.1
          KNEX_HOST: 127.0.0.1
          PGHOST: 127.0.0.1
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() { 
            echo "→ $*"
            if eval "$@"; then 
              echo "✓ OK: $*"
              echo "$*" > ../.last_migration_cmd
              exit 0
            fi
          }

          echo "🧭 Scripts disponibles:"
          npm run || true

          # 1) NPM scripts preferidos
          if have_script db:migrate;        then try_run npm run db:migrate;        fi
          if have_script migrate;           then try_run npm run migrate;           fi
          if have_script typeorm:migrate;   then try_run npm run typeorm:migrate;   fi
          if have_script prisma:migrate;    then try_run npm run prisma:migrate;    fi
          if have_script knex:migrate;      then try_run npm run knex:migrate;      fi
          if have_script sequelize:migrate; then try_run npm run sequelize:migrate; fi

          # 2) Prisma si hay schema
          if [ -f prisma/schema.prisma ] || [ -f schema.prisma ]; then
            try_run npx prisma migrate deploy
          fi

          # 3) TypeORM autodetectando dataSource (-d obligatorio)
          ds_candidates=(
            "src/database/data-source.ts"
            "src/data-source.ts"
            "src/datasource.ts"
            "src/database/data-source.js"
            "dist/database/data-source.js"
            "dist/data-source.js"
            "ormconfig.ts"
            "ormconfig.js"
            "ormconfig.json"
          )
          found_ds=""
          for p in "${ds_candidates[@]}"; do
            if [ -f "$p" ]; then found_ds="$p"; break; fi
          done
          if [ -n "$found_ds" ]; then
            echo "🔎 TypeORM dataSource: $found_ds"
            try_run npx typeorm migration:run -d "$found_ds"
            try_run npx ts-node --transpile-only ./node_modules/typeorm/cli.js migration:run -d "$found_ds"
            try_run node --loader ts-node/esm ./node_modules/typeorm/cli.js migration:run -d "$found_ds"
            try_run node ./node_modules/typeorm/cli.js migration:run -d "$found_ds"
          fi

          # 4) Knex
          if [ -f knexfile.ts ] || [ -f knexfile.js ]; then
            try_run npx knex migrate:latest
          fi

          # 5) Sequelize
          if [ -d "migrations" ] && [ -f "node_modules/.bin/sequelize-cli" ]; then
            try_run npx sequelize-cli db:migrate
          fi

          echo "❌ No encontré comando de migraciones que funcione."
          echo "   Pista: si usas TypeORM, revisa -d <ruta-al-data-source>."
          exit 1

      - name: Seed DB (auto-detect)
        shell: bash
        env:
          DB_HOST: 127.0.0.1
          DATABASE_HOST: 127.0.0.1
          TYPEORM_HOST: 127.0.0.1
          KNEX_HOST: 127.0.0.1
          PGHOST: 127.0.0.1
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() { echo "→ $*"; if eval "$@"; then echo "✓ OK: $*"; echo "$*" > ../.last_seed_cmd; exit 0; fi; }

          # Scripts comunes
          if have_script db:seed;        then try_run npm run db:seed;        fi
          if have_script seed;           then try_run npm run seed;           fi
          if have_script prisma:seed;    then try_run npm run prisma:seed;    fi
          if have_script knex:seed;      then try_run npm run knex:seed;      fi
          if have_script sequelize:seed; then try_run npm run sequelize:seed; fi

          # CLIs comunes
          if [ -f prisma/schema.prisma ] || [ -f schema.prisma ]; then
            try_run npx prisma db seed
          fi
          if [ -f knexfile.ts ] || [ -f knexfile.js ]; then
            try_run npx knex seed:run
          fi
          if [ -f "node_modules/.bin/sequelize-cli" ]; then
            try_run npx sequelize-cli db:seed:all
          fi

          echo "⚠️  No encontré comando de seed. Continuo sin seed."

      - name: Boot API (docker compose)
        shell: bash
        env:
          DOCS_ENABLED: 0
        run: |
          set -euxo pipefail
          # Detectar servicio que contenga "api"
          API_SVC="$(docker compose config --services | grep -E '^api$|api' | head -n1 || true)"
          if [ -n "$API_SVC" ]; then
            docker compose pull "$API_SVC" || true
            docker compose up -d "$API_SVC"
          else
            echo "⚠️ No encontré servicio 'api' en docker compose; skipping lift de API."
            exit 0
          fi

          echo "⏳ Esperando API /health…"
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health && break || true
            sleep 2
          done
          curl -fsS http://localhost:3000/health || true

      - name: Run focused smokes (rápidos)
        shell: bash
        run: |
          set -euxo pipefail
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (opcional)
        shell: bash
        env:
          CONTINUE_ON_FAIL: "1"
        run: |
          set -euxo pipefail
          ./script/smoke_all.sh || true

      # ── RECOLECCIÓN DE LOGS (siempre) ──────────────────────────────────────────
      - name: Capturar logs de Docker y API (siempre)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs backend/logs

          # Compose (arranque/errores)
          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true
          cp -f logs/compose-logs.txt backend/logs/compose-logs.txt 2>/dev/null || true

          # API: detectar contenedor con "api"
          API_CTN="$(docker ps --format '{{.Names}}' | grep -E 'api' | head -n1 || true)"
          if [ -n "$API_CTN" ]; then
            docker logs "$API_CTN" > logs/api.log 2>&1 || true
            cp -f logs/api.log backend/logs/api.log 2>/dev/null || true
          else
            echo "(no se detectó contenedor API)" > logs/api.log
            cp -f logs/api.log backend/logs/api.log 2>/dev/null || true
          fi

      - name: Subir artifacts (único, nombre único por intento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/logs/smoke_all.*/**
            backend/logs/**
            logs/compose-logs.txt
            logs/api.log
          if-no-files-found: ignore
