name: Backend Smokes

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  smokes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    env:
      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          set -euxo pipefail
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..40}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break || true
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break || true
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      # ---- FIX DNS para herramientas que usan "db" fuera de Docker ----
      - name: Map host 'db' -> localhost (fix EAI_AGAIN)
        shell: bash
        run: |
          set -euxo pipefail
          echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          getent hosts db

      - name: Run DB migrations (auto-detect, TypeORM-first)
        shell: bash
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_migration_cmd
              exit 0
            fi
          }

          # Prefer npm scripts si existen
          if have_script db:migrate;        then try_run npm run db:migrate;        fi
          if have_script migrate;           then try_run npm run migrate;           fi
          if have_script typeorm:migrate;   then try_run npm run typeorm:migrate;   fi
          if have_script prisma:migrate;    then try_run npm run prisma:migrate;    fi
          if have_script knex:migrate;      then try_run npm run knex:migrate;      fi
          if have_script sequelize:migrate; then try_run npm run sequelize:migrate; fi

          # --- TypeORM variantes robustas ---
          # 1) Usar el data-source compilado primero
          for DS in \
            dist/database/data-source.js \
            dist/src/database/data-source.js \
            dist/database/data-source.cjs \
            dist/src/database/data-source.cjs
          do
            [ -f "$DS" ] && try_run npx typeorm migration:run -d "$DS"
          done

          # 2) Correr con ts-node (commonjs + paths) sobre el .ts
          if [ -f src/database/data-source.ts ]; then
            try_run npx ts-node -O '{"module":"commonjs"}' \
              -r tsconfig-paths/register ./node_modules/typeorm/cli.js migration:run \
              -d src/database/data-source.ts

            try_run node --require ts-node/register --require tsconfig-paths/register \
              ./node_modules/typeorm/cli.js migration:run \
              -d src/database/data-source.ts

            # Como último recurso, loader ESM
            try_run node --loader ts-node/esm ./node_modules/typeorm/cli.js \
              migration:run -d src/database/data-source.ts
          fi

          # --- Otros ORMs comunes (por si el repo no usa TypeORM) ---
          try_run npx prisma migrate deploy
          try_run npx knex migrate:latest
          try_run npx sequelize-cli db:migrate

          echo "❌ No encontré comando de migraciones que funcione." >&2
          exit 1

      - name: Seed DB (auto-detect, robusto)
        shell: bash
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_seed_cmd
              exit 0
            fi
          }

          # Prefer npm scripts
          if have_script db:seed;        then try_run npm run db:seed;        fi
          if have_script seed;           then try_run npm run seed;           fi
          if have_script typeorm:seed;   then try_run npm run typeorm:seed;   fi
          if have_script prisma:seed;    then try_run npm run prisma:seed;    fi
          if have_script knex:seed;      then try_run npm run knex:seed;      fi
          if have_script sequelize:seed; then try_run npm run sequelize:seed; fi

          # TypeORM: JS compilado
          for S in \
            dist/database/seed.js \
            dist/src/database/seed.js
          do
            [ -f "$S" ] && try_run node "$S"
          done

          # TypeORM: TS con ts-node
          for S in \
            src/database/seed.ts \
            src/seed.ts
          do
            [ -f "$S" ] && try_run npx ts-node -O '{"module":"commonjs"}' -r tsconfig-paths/register "$S"
          done

          # Prisma / Knex / Sequelize (CLI)
          try_run npx prisma db seed
          try_run npx knex seed:run
          try_run npx sequelize-cli db:seed:all

          echo "⚠️  No encontré comando de seed. Continuo sin seed."

      - name: Boot API (docker compose)
        shell: bash
        env:
          DOCS_ENABLED: 0
        run: |
          set -euxo pipefail
          docker compose pull api || true
          docker compose up -d api

          echo "⏳ Esperando API /health…"
          for i in {1..40}; do
            curl -fsS http://localhost:3000/health && break || true
            sleep 2
          done
          curl -fsS http://localhost:3000/health || true

      - name: Run focused smokes (rápidos)
        shell: bash
        run: |
          set -euxo pipefail
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (opcional)
        shell: bash
        env:
          CONTINUE_ON_FAIL: "1"
        run: |
          set -euxo pipefail
          ./script/smoke_all.sh || true

      # ── LOGS SIEMPRE ──────────────────────────────────────────────────────────
      - name: Capturar logs de Docker y API (siempre)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs backend/logs
          # compose (arranque, errores)
          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true

          # api (si está corriendo)
          CID=$(docker compose ps -q api || true)
          if [ -n "$CID" ]; then
            docker logs "$CID" > logs/api.log 2>&1 || true
          else
            echo "(no se detectó contenedor API)" > logs/api.log
          fi

          # Copiar también a backend/logs para compatibilidad con scripts previos
          cp -f logs/compose-logs.txt backend/logs/compose-logs.txt 2>/dev/null || true
          cp -f logs/api.log          backend/logs/api.log          2>/dev/null || true

      - name: Subir artifacts (smoke-logs, único por intento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/logs/**
            backend/logs/*
            logs/compose-logs.txt
            logs/api.log
          if-no-files-found: ignore
