name: Backend Smokes

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  smokes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    env:
      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          docker compose pull db minio || true
          docker compose up -d db minio
          echo "⏳ Esperando Postgres…"
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break
            sleep 2
          done
          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Boot API (docker compose)
        shell: bash
        env:
          DOCS_ENABLED: 0
        run: |
          docker compose pull api || true
          docker compose up -d api
          echo "⏳ Esperando API /health…"
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/health

      - name: Run focused smokes (rápidos)
        env:
          API: http://localhost:3000/v1
          KEY: superdev
        run: |
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      # —— siempre recolectar logs aunque falle ——
      - name: Collect docker & api logs
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p backend/logs/ci
          docker compose ps > backend/logs/ci/compose-ps.txt || true
          docker compose logs --no-color > backend/logs/ci/compose-logs.txt || true
          # logs del contenedor api si existe
          docker ps --format '{{.Names}}' | grep -q '^isp-api$' && docker logs isp-api > backend/logs/ci/api.log || true

      - name: Upload smoke logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            backend/logs/**
            backend/logs/ci/**
          if-no-files-found: warn
          retention-days: 7
