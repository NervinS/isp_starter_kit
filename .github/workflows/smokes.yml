name: Backend Smokes

on:
  push:
    branches: [ feat/**, main ]
  pull_request:

jobs:
  smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: ispuser
          POSTGRES_PASSWORD: ispuser
          POSTGRES_DB: ispdb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ispuser -d ispdb"
          --health-interval=5s --health-timeout=5s --health-retries=10
      minio:
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
        ports: ['9000:9000', '9001:9001']
        options: >-
          --health-cmd="curl -s http://localhost:9000/minio/health/live || exit 1"
          --health-interval=5s --health-timeout=5s --health-retries=20
        command: server /data --console-address ":9001"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Boot API (Docker Compose)
        working-directory: backend
        run: |
          docker compose up -d db minio
          # espera servicios
          sleep 10
          docker compose up -d api
          # sanity check
          curl -sfS http://localhost:3000/health

      - name: Run focused smokes (rápidos)
        working-directory: backend
        env:
          API_BASE: http://localhost:3000
          API_KEY: superdev
        run: |
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Archive smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: backend/logs/**
