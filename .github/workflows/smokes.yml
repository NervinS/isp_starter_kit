name: Backend Smokes

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  smokes:
    runs-on: ubuntu-24.04

    # Todo ocurre dentro de backend/
    defaults:
      run:
        working-directory: backend

    env:
      # Endpoints por defecto (se reescriben tras detectar puerto y ruta)
      API_BASE: http://localhost:3000
      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: "0"

      # Credenciales DB para CLIs/API local (igual que tu compose)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ispuser
      DB_PASSWORD: isp123
      DB_DATABASE: ispdb
      DATABASE_URL: postgresql://ispuser:isp123@db:5432/ispdb

    steps:
      - uses: actions/checkout@v4

      # ---------- Node (backend) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (best-effort)
        run: npm run build || true

      # ---------- Infra: DB + MinIO (compose en backend/) ----------
      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          set -euxo pipefail
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..60}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break || true
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..60}; do
            curl -fsS http://localhost:9000/minio/health/live && break || true
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      # Si Node fuera de Docker resuelve "db" pero el puerto no está publicado,
      # no hay nada que hacer desde aquí. En tu repo ya te funcionó esta conexión con CLIs.
      - name: Map host 'db' -> localhost (mitiga EAI_AGAIN)
        shell: bash
        run: |
          set -euxo pipefail
          echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          getent hosts db

      # ---------- Migraciones / Seed ----------
      - name: Run DB migrations (auto-detect, TypeORM-first)
        shell: bash
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
          TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs"}'
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_migration_cmd
              exit 0
            fi
          }

          if have_script db:migrate;      then try_run npm run db:migrate;      fi
          if have_script migrate;         then try_run npm run migrate;         fi
          if have_script typeorm:migrate; then try_run npm run typeorm:migrate; fi

          for DS in \
            dist/database/data-source.js \
            dist/src/database/data-source.js \
            dist/database/data-source.cjs \
            dist/src/database/data-source.cjs
          do
            [ -f "$DS" ] && try_run npx typeorm migration:run -d "$DS"
          done

          if [ -f src/database/data-source.ts ]; then
            try_run npx tsx -r reflect-metadata ./node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts
            try_run npx tsx -r reflect-metadata node_modules/typeorm/cli.js   migration:run -d src/database/data-source.ts
          fi

          try_run npx prisma migrate deploy
          try_run npx knex migrate:latest
          try_run npx sequelize-cli db:migrate

          echo "❌ No encontré comando de migraciones que funcione." >&2
          exit 1

      - name: Seed DB (auto-detect, robusto)
        shell: bash
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
          TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs"}'
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_seed_cmd
              exit 0
            fi
          }

          if have_script db:seed;        then try_run npm run db:seed;        fi
          if have_script seed;           then try_run npm run seed;           fi
          if have_script typeorm:seed;   then try_run npm run typeorm:seed;   fi
          if have_script prisma:seed;    then try_run npm run prisma:seed;    fi
          if have_script knex:seed;      then try_run npm run knex:seed;      fi
          if have_script sequelize:seed; then try_run npm run sequelize:seed; fi

          for S in dist/database/seed.js dist/src/database/seed.js; do
            [ -f "$S" ] && try_run node "$S"
          done

          for S in src/database/seed.ts src/seed.ts; do
            [ -f "$S" ] && try_run npx tsx "$S"
          done

          try_run npx prisma db seed
          try_run npx knex seed:run
          try_run npx sequelize-cli db:seed:all

          echo "⚠️  No encontré comando de seed. Continuo sin seed."

      - name: Seed CI (desde archivo del repo)
        shell: bash
        run: |
          set -euxo pipefail
          docker compose exec -T db sh -lc 'cat > /tmp/seed_ci.sql' < script/seed_ci.sql
          docker compose exec -T db psql -U ispuser -d ispdb -f /tmp/seed_ci.sql
          docker compose exec -T db psql -U ispuser -d ispdb -c \
            "SELECT codigo,tipo,estado FROM ordenes WHERE codigo='INS-CI-0001';" || true

      # ---------- API local (siempre) ----------
      - name: Boot API locally (fallback definitivo)
        id: boot_local_api
        shell: bash
        env:
          HOST: 0.0.0.0
          PORT: "3000"
          DOCS_ENABLED: "0"
        run: |
          set -euo pipefail

          HEALTH_PATHS="/health /v1/health /api/health"
          SCAN_PORTS="3000 8080 4000"

          # Elegir comando de arranque
          if npm run | awk '{print $1}' | grep -xq "start:prod"; then
            START_CMD="npm run start:prod"
          elif npm run | awk '{print $1}' | grep -xq "start"; then
            START_CMD="npm run start"
          elif [ -f dist/main.js ]; then
            START_CMD="node dist/main.js"
          elif [ -f dist/src/main.js ]; then
            START_CMD="node dist/src/main.js"
          elif [ -f dist/app.js ]; then
            START_CMD="node dist/app.js"
          else
            echo "❌ No encontré comando ni archivo de arranque para API local." >&2
            exit 1
          fi

          echo "→ START_CMD: $START_CMD"

          # Export envs y arranque en background
          export HOST=0.0.0.0 PORT=3000 \
                 DB_HOST="${DB_HOST}" DB_PORT="${DB_PORT}" \
                 DB_USERNAME="${DB_USERNAME}" DB_PASSWORD="${DB_PASSWORD}" \
                 DB_DATABASE="${DB_DATABASE}" DATABASE_URL="${DATABASE_URL}" \
                 KEY="${KEY}" DOCS_ENABLED="${DOCS_ENABLED}"

          nohup bash -lc "$START_CMD" > /tmp/api-local.log 2>&1 & echo $! > /tmp/api-local.pid || true

          FOUND_PORT=""
          FOUND_PATH=""

          echo "⏳ Esperando health de API local…"
          for i in {1..150}; do
            for P in $SCAN_PORTS; do
              for HP in $HEALTH_PATHS; do
                if curl -fsS "http://localhost:${P}${HP}" >/dev/null 2>&1; then
                  FOUND_PORT="$P"; FOUND_PATH="$HP"; break 3
                fi
              done
            done
            sleep 2
          done

          if [ -z "$FOUND_PORT" ]; then
            echo "❌ API local no respondió health."
            [ -f /tmp/api-local.log ] && tail -n 200 /tmp/api-local.log || true
            exit 1
          fi

          API_BASE="http://localhost:${FOUND_PORT}"
          echo "✅ API local OK en ${API_BASE}${FOUND_PATH}"

          {
            echo "api_base=$API_BASE"
            echo "health_path=$FOUND_PATH"
            echo "port=$FOUND_PORT"
          } | tee -a "$GITHUB_OUTPUT"

          {
            echo "API_BASE=$API_BASE"
            echo "API=$API_BASE/v1"
          } | tee -a "$GITHUB_ENV"

      # ---------- Smokes ----------
      - name: Print resolved API endpoints
        shell: bash
        run: |
          echo "API_BASE=$API_BASE"
          echo "API=$API"

      - name: Run focused smokes (rápidos)
        shell: bash
        env:
          API_BASE: ${{ env.API_BASE }}
          API: ${{ env.API }}
        run: |
          set -euxo pipefail
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (opcional)
        shell: bash
        env:
          CONTINUE_ON_FAIL: "1"
          API_BASE: ${{ env.API_BASE }}
          API: ${{ env.API }}
        run: |
          set -euxo pipefail
          ./script/smoke_all.sh || true

      # ---------- Diagnóstico & artifacts ----------
      - name: Diagnóstico post-API
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          echo "API_BASE(final)=$API_BASE  API=$API"
          echo "── docker compose ps"
          docker compose ps || true
          echo "── docker compose images"
          docker compose images || true
          echo "── tail /tmp/api-local.log (si existe)"
          [ -f /tmp/api-local.log ] && tail -n 200 /tmp/api-local.log || echo "(sin log local)"
          echo "── Probar health desde host"
          for P in 3000 8080 4000; do
            for HP in /health /v1/health /api/health; do
              curl -sv --max-time 5 "http://localhost:${P}${HP}" || true
            done
          done

      - name: Capturar logs (compose + API local)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs backend/logs || true
          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true
          if [ -f /tmp/api-local.log ]; then
            cp -f /tmp/api-local.log logs/api.log
          else
            echo "(no log local)" > logs/api.log
          fi
          # compatibilidad con paths anteriores
          cp -f logs/compose-logs.txt backend/logs/compose-logs.txt 2>/dev/null || true
          cp -f logs/api.log          backend/logs/api.log          2>/dev/null || true

      - name: Subir artifacts (smoke-logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/logs/**
            backend/logs/*
            backend/logs/compose-logs.txt
            backend/logs/api.log
            logs/compose-logs.txt
            logs/api.log
          if-no-files-found: ignore
