name: Backend Smokes

on:
  push:
    branches: [ main, feat/** ]
  pull_request:

jobs:
  smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Boot infra (db + minio) via docker compose
        working-directory: backend
        run: |
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      - name: Boot API (docker compose)
        working-directory: backend
        env:
          DOCS_ENABLED: "0"
        run: |
          docker compose pull api || true
          docker compose up -d api

          echo "⏳ Esperando API /health…"
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/health

      - name: Run focused smokes (rápidos)
        working-directory: backend
        env:
          API: http://localhost:3000/v1
          KEY: superdev
        run: |
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (si quieres, opcional)
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: backend
        env:
          API: http://localhost:3000/v1
          KEY: superdev
          CONTINUE_ON_FAIL: "1"
        run: |
          ./script/smoke_all.sh || true

      - name: Archive smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: backend/logs/**

      - name: Dump docker compose ps (debug)
        if: failure()
        working-directory: backend
        run: docker compose ps

      - name: Show API logs (debug)
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color --tail=300 api
