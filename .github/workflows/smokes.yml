name: Backend Smokes

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  smokes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    env:
      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: 0
      # Credenciales DB para CLIs fuera de Docker (typeorm/prisma/knex/etc.)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ispuser
      DB_PASSWORD: isp123
      DB_DATABASE: ispdb
      DATABASE_URL: postgresql://ispuser:isp123@db:5432/ispdb

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      # ── Infra: DB + MinIO ─────────────────────────────────────────────────────
      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          set -euxo pipefail
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..40}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break || true
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break || true
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      # Fix DNS: herramientas Node fuera de Docker que se conectan a "db"
      - name: Map host 'db' -> localhost (fix EAI_AGAIN)
        shell: bash
        run: |
          set -euxo pipefail
          echo "127.0.0.1 db" | sudo tee -a /etc/hosts
          getent hosts db

      # ── Migraciones ───────────────────────────────────────────────────────────
      - name: Run DB migrations (auto-detect, TypeORM-first)
        shell: bash
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
          TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs"}'
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_migration_cmd
              exit 0
            fi
          }

          # 0) Scripts del repo
          if have_script db:migrate;        then try_run npm run db:migrate;        fi
          if have_script migrate;           then try_run npm run migrate;           fi
          if have_script typeorm:migrate;   then try_run npm run typeorm:migrate;   fi

          # 1) TypeORM con build (evita lío ESM/CJS)
          for DS in \
            dist/database/data-source.js \
            dist/src/database/data-source.js \
            dist/database/data-source.cjs \
            dist/src/database/data-source.cjs
          do
            [ -f "$DS" ] && try_run npx typeorm migration:run -d "$DS"
          done

          # 2) TypeORM en TS con TSX
          if [ -f src/database/data-source.ts ]; then
            try_run npx tsx -r reflect-metadata ./node_modules/typeorm/cli.js migration:run -d src/database/data-source.ts
            try_run npx tsx -r reflect-metadata node_modules/typeorm/cli.js   migration:run -d src/database/data-source.ts
          fi

          # 3) Alternativas comunes
          try_run npx prisma migrate deploy
          try_run npx knex migrate:latest
          try_run npx sequelize-cli db:migrate

          echo "❌ No encontré comando de migraciones que funcione." >&2
          exit 1

      # ── Seed genérico ─────────────────────────────────────────────────────────
      - name: Seed DB (auto-detect, robusto)
        shell: bash
        env:
          TS_NODE_TRANSPILE_ONLY: "1"
          TS_NODE_COMPILER_OPTIONS: '{"module":"commonjs"}'
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_seed_cmd
              exit 0
            fi
          }

          # Preferir scripts
          if have_script db:seed;        then try_run npm run db:seed;        fi
          if have_script seed;           then try_run npm run seed;           fi
          if have_script typeorm:seed;   then try_run npm run typeorm:seed;   fi
          if have_script prisma:seed;    then try_run npm run prisma:seed;    fi
          if have_script knex:seed;      then try_run npm run knex:seed;      fi
          if have_script sequelize:seed; then try_run npm run sequelize:seed; fi

          # TypeORM seed JS compilado
          for S in dist/database/seed.js dist/src/database/seed.js; do
            [ -f "$S" ] && try_run node "$S"
          done

          # TypeORM seed TS con TSX
          for S in src/database/seed.ts src/seed.ts; do
            [ -f "$S" ] && try_run npx tsx "$S"
          done

          # Prisma / Knex / Sequelize (CLI)
          try_run npx prisma db seed
          try_run npx knex seed:run
          try_run npx sequelize-cli db:seed:all

          echo "⚠️  No encontré comando de seed. Continuo sin seed."

      # ── Seed CI específico (idempotente) ─────────────────────────────────────
      - name: Seed CI (desde archivo del repo)
        shell: bash
        run: |
          set -euxo pipefail
          docker compose exec -T db sh -lc 'cat > /tmp/seed_ci.sql' < backend/script/seed_ci.sql
          docker compose exec -T db psql -U ispuser -d ispdb -f /tmp/seed_ci.sql
          # sanity check (no rompe el job si falla)
          docker compose exec -T db psql -U ispuser -d ispdb -c \
            "SELECT codigo,tipo,estado FROM ordenes WHERE codigo='INS-CI-0001';" || true

      # ── Detectar servicio API ────────────────────────────────────────────────
      - name: Detect API service name
        id: detect_api
        shell: bash
        run: |
          set -euo pipefail
          SVC="$(docker compose config --services | grep -E '^(api|server|app|web)$' | head -n1 || true)"
          if [ -z "${SVC}" ]; then
            # intento por puerto publicado 3000
            SVC="$(docker compose config | awk '
              /services:/ {in_s=1; next}
              in_s && /^[[:space:]]+[a-zA-Z0-9_-]+:/ {gsub(":","",$1); svc=$1}
              /ports:/ {in_p=1}
              in_p && /3000:3000/ {print svc; exit}
              /^[[:space:]]*[a-zA-Z0-9_-]+:/ && $1 !~ /ports:/ {in_p=0}
            ')"
          fi
          echo "api_service=${SVC:-api}" >> "$GITHUB_OUTPUT"
          echo "→ api_service=${SVC:-api}"

      # ── API & smokes ─────────────────────────────────────────────────────────
      - name: Boot API (docker compose)
        shell: bash
        env:
          DOCS_ENABLED: 0
        run: |
          set -euxo pipefail
          SVC="${{ steps.detect_api.outputs.api_service }}"
          docker compose pull "$SVC" || true
          docker compose up -d "$SVC"

          echo "⏳ Esperando API /health… (hasta 3 min)"
          for i in {1..90}; do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "API OK"
              break
            fi
            sleep 2
          done || true

      - name: Run focused smokes (rápidos)
        shell: bash
        run: |
          set -euxo pipefail
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (opcional)
        shell: bash
        env:
          CONTINUE_ON_FAIL: "1"
        run: |
          set -euxo pipefail
          ./script/smoke_all.sh || true

      # ── Diagnóstico post-API ────────────────────────────────────────────────
      - name: Diagnóstico post-API
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          echo "── docker compose ps"
          docker compose ps || true
          echo "── docker compose config (servicios)"
          docker compose config --services || true
          echo "── docker compose images"
          docker compose images || true

          SVC="${{ steps.detect_api.outputs.api_service }}"
          CID="$(docker compose ps -q "$SVC" || true)"
          if [ -n "$CID" ]; then
            echo "── Logs recientes de API"
            docker logs --since 10m "$CID" || true

            echo "── Health desde dentro del contenedor"
            docker compose exec -T "$SVC" sh -lc 'wget -qO- http://localhost:3000/health || curl -fsS http://localhost:3000/health || true' || true

            echo "── Puertos expuestos"
            docker inspect "$CID" --format='{{json .NetworkSettings.Ports}}' | jq . || true
          else
            echo "⚠️  (no se detectó contenedor API: $SVC)"
          fi

      # ── LOGS & ARTIFACTS ─────────────────────────────────────────────────────
      - name: Capturar logs de Docker y API (siempre)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs backend/logs

          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true

          SVC="${{ steps.detect_api.outputs.api_service }}"
          CID="$(docker compose ps -q "$SVC" || true)"
          if [ -n "$CID" ]; then
            docker logs "$CID" > logs/api.log 2>&1 || true
          else
            echo "(no se detectó contenedor API)" > logs/api.log
          fi

          cp -f logs/compose-logs.txt backend/logs/compose-logs.txt 2>/dev/null || true
          cp -f logs/api.log          backend/logs/api.log          2>/dev/null || true

      - name: Subir artifacts (smoke-logs, único por intento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/logs/**
            backend/logs/*
            logs/compose-logs.txt
            logs/api.log
          if-no-files-found: ignore
