name: Backend Smokes

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  smokes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    env:
      API: http://localhost:3000/v1
      KEY: superdev
      DOCS_ENABLED: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Boot infra (db + minio) via docker compose
        shell: bash
        run: |
          set -euxo pipefail
          docker compose pull db minio || true
          docker compose up -d db minio

          echo "⏳ Esperando Postgres…"
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U ispuser -d ispdb && break
            sleep 2
          done
          docker compose exec -T db pg_isready -U ispuser -d ispdb

          echo "⏳ Esperando MinIO…"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done
          curl -fsS http://localhost:9000/minio/health/live

      - name: Run DB migrations (auto-detect)
        shell: bash
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_migration_cmd
              exit 0
            fi
          }

          # Prefer npm scripts if existen
          if have_script db:migrate;        then try_run npm run db:migrate;        fi
          if have_script migrate;           then try_run npm run migrate;           fi
          if have_script prisma:migrate;    then try_run npm run prisma:migrate;    fi
          if have_script typeorm:migrate;   then try_run npm run typeorm:migrate;   fi
          if have_script knex:migrate;      then try_run npm run knex:migrate;      fi
          if have_script sequelize:migrate; then try_run npm run sequelize:migrate; fi

          # Variantes comunes por CLI
          try_run npx prisma migrate deploy
          try_run npx typeorm migration:run
          try_run npx knex migrate:latest
          try_run npx sequelize-cli db:migrate

          echo "❌ No encontré comando de migraciones que funcione." >&2
          exit 1

      - name: Seed DB (auto-detect)
        shell: bash
        run: |
          set -euo pipefail

          have_script() { npm run | awk '{print $1}' | grep -xq "$1" ; }
          try_run() {
            echo "→ $*"
            if eval "$@"; then
              echo "✓ OK: $*"
              echo "$*" > ../.last_seed_cmd
              exit 0
            fi
          }

          # Prefer npm scripts si existen
          if have_script db:seed;        then try_run npm run db:seed;        fi
          if have_script seed;           then try_run npm run seed;           fi
          if have_script prisma:seed;    then try_run npm run prisma:seed;    fi
          if have_script knex:seed;      then try_run npm run knex:seed;      fi
          if have_script sequelize:seed; then try_run npm run sequelize:seed; fi

          # Variantes comunes por CLI
          try_run npx prisma db seed
          try_run npx knex seed:run
          try_run npx sequelize-cli db:seed:all

          echo "⚠️  No encontré comando de seed. Continuo sin seed."
          # No hacemos exit 1: algunos repos no requieren seed explícito.

      - name: Boot API (docker compose)
        shell: bash
        env:
          DOCS_ENABLED: 0
        run: |
          set -euxo pipefail
          # Intentar pull; si no existe la imagen, Compose nos dice que hay que build
          docker compose pull api || true
          docker compose up -d api

          echo "⏳ Esperando API /health…"
          for i in {1..30}; do
            curl -fsS http://localhost:3000/health && break || true
            sleep 2
          done
          # Una lectura final para dejar trazado visible
          curl -fsS http://localhost:3000/health || true

      - name: Run focused smokes (rápidos)
        shell: bash
        run: |
          set -euxo pipefail
          ONLY="smoke_equipos_ciclo.sh,smoke_materiales_ciclo.sh,smoke_kardex_material.sh" ./script/smoke_all.sh

      - name: Run full smokes (si quieres, opcional)
        shell: bash
        env:
          CONTINUE_ON_FAIL: "1"
        run: |
          set -euxo pipefail
          ./script/smoke_all.sh || true

      # ── RECOLECCIÓN DE LOGS PARA ARTIFACTS (siempre) ──────────────────────────
      - name: Capturar logs de Docker y API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          # compose (arranque, errores…)
          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true
          # api (stacktraces/500)
          # El nombre del contenedor proviene de docker-compose (service "api")
          docker logs isp-api > logs/api.log 2>&1 || true

      - name: Subir artifacts (smoke-logs + docker/api logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            backend/logs/smoke_all.*/**
            backend/logs/smoke_all.*/*
            backend/logs/**
            backend/logs/*
            backend/logs
            backend/logs/compose-logs.txt
            backend/logs/api.log
            logs/compose-logs.txt
            logs/api.log
          if-no-files-found: ignore

      - name: Capturar logs de Docker y API (robusto)
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          # carpetas en el cwd (backend) y una copia en backend/logs por si cambia el wd
          mkdir -p logs backend/logs

          # ── compose logs (arranque, errores, etc.) ─────────────────────────────
          # Deja también el estado de compose para contexto
          docker compose ps || true
          docker compose config || true
          docker compose logs --no-color > logs/compose-logs.txt 2>&1 || true
          cp -f logs/compose-logs.txt backend/logs/compose-logs.txt || true

          # ── api.log: detectar contenedor por etiqueta de compose ──────────────
          # Busca el primer contenedor con service=api
          API_CID="$(docker ps -q -f "label=com.docker.compose.service=api" | head -n1 || true)"
          if [ -n "${API_CID:-}" ]; then
            docker logs "$API_CID" > logs/api.log 2>&1 || true
          else
            echo "No se encontró contenedor con label com.docker.compose.service=api" > logs/api.log
          fi
          cp -f logs/api.log backend/logs/api.log || true

      # ── RECOLECCIÓN DE LOGS (robusta en runners de GitHub) ───────────────────
      - name: Capturar logs de Docker y API (robusto)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/logs

          # Estado de servicios y contenedores (útil para diagnosticar nombres)
          docker compose ps --services         > backend/logs/compose-ps.txt  2>&1 || true
          docker compose ps                    > backend/logs/compose-ps-full.txt 2>&1 || true
          docker ps -a                         > backend/logs/docker-ps.txt   2>&1 || true

          # Todos los logs de compose
          docker compose logs --no-color       > backend/logs/compose-logs.txt 2>&1 || true

          # Logs de la API por servicio (independiente del nombre de contenedor)
          docker compose logs --no-color api   > backend/logs/api.log 2>&1 || true

          # Fallback: si api.log quedó vacío, intenta con el primer contenedor que parezca "api"
          if [ ! -s backend/logs/api.log ]; then
            cname="$(docker ps --format '{{.Names}}' | grep -Ei '(^|[-_])api([-_]|$)|backend[-_]api' | head -n1 || true)"
            if [ -n "$cname" ]; then
              docker logs "$cname" > backend/logs/api.log 2>&1 || true
            fi
          fi

      - name: Subir artifacts (smoke-logs + docker/api logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            backend/logs/smoke_all.*/**
            backend/logs/smoke_all.*/*
            backend/logs/**
            backend/logs/*
            backend/logs
          if-no-files-found: ignore
