name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-smokes:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .env (si falta)
        working-directory: backend
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & up stack (docker compose)
        working-directory: backend
        run: |
          docker compose pull || true
          docker compose up -d --build
          echo "⌛ Esperando API health..."
          for i in {1..40}; do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "✅ API OK"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/health

      - name: Run smoke_all.sh
        working-directory: backend
        env:
          CONTINUE_ON_FAIL: "0"
        run: |
          chmod +x script/*.sh || true
          ./script/smoke_all.sh

      - name: Upload smoke logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: backend/logs/**

      - name: Dump compose logs on failure
        if: failure()
        working-directory: backend
        run: |
          docker compose ps
          docker compose logs --no-color > compose.logs.txt || true
          echo "::group::compose.logs"
          tail -n 800 compose.logs.txt || true
          echo "::endgroup::"

      - name: Teardown
        if: always()
        working-directory: backend
        run: docker compose down -v
