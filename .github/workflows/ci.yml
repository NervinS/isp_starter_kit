name: ci

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: ispuser
          POSTGRES_PASSWORD: isppass
          POSTGRES_DB: ispdb
        ports:
          - "5432:5432"
        # healthcheck similar al de los logs
        options: >-
          --health-cmd="pg_isready -U ispuser -d ispdb -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        env:
          PGPASSWORD: isppass
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            pg_isready -h 127.0.0.1 -U ispuser -d ispdb && break
            sleep 1
          done
          psql -h 127.0.0.1 -U ispuser -d ispdb -c "SELECT version();"

      # ===== MIGRACIONES EN ORDEN =====
      - name: Apply inventory migrations (ordered)
        env:
          PGPASSWORD: isppass
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_inventario_core.sql
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_stock_almacen_timestamps.sql
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_movimientos_tipo_traslado.sql
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_inventario_funcs_force.sql
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_inventario_funcs.sql
          # Guardrail: no permitir saldos negativos (debe correr antes de la vista kardex)
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_guardrail_stock_nonnegative.sql
          # Vista kardex depende de movimientos y (opcionalmente) del guardrail
          psql -h 127.0.0.1 -U ispuser -d ispdb -v ON_ERROR_STOP=1 -f backend/script/migration_20251002_kardex_view.sql

      # (Opcional) instala dependencias backend y corre smokes si los tienes
      # - name: Backend install
      #   working-directory: backend
      #   run: npm ci
      #
      # - name: Smoke tests
      #   working-directory: backend
      #   env:
      #     DATABASE_URL: postgres://ispuser:isppass@127.0.0.1:5432/ispdb
      #   run: npm run smoke
