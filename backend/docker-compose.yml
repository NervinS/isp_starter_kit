services:
  db:
    image: postgres:14-alpine
    container_name: isp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ispuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isppass}   # solo en el primer init del volumen
      POSTGRES_DB: ${POSTGRES_DB:-ispdb}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"                                       # host 5433 -> container 5432
    volumes:
      - db_data:/var/lib/postgresql/data
      # - ../db/init:/docker-entrypoint-initdb.d:ro       # opcional (solo clúster NUEVO)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ispuser} -d ${POSTGRES_DB:-ispdb} -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: isp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isp-api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}

      # 🔗 Base de datos — SIEMPRE por servicio 'db' dentro de Docker
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ispuser}:${POSTGRES_PASSWORD:-isppass}@db:5432/${POSTGRES_DB:-ispdb}}

      # 🔐 JWT (usa tu .env en local / secrets en CI)
      JWT_SECRET: ${JWT_SECRET:-devsecretchangeme_local}

      # 📦 MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}

      # 🧪 smokes locales
      SMOKE_BYPASS_TECH_GUARD: ${SMOKE_BYPASS_TECH_GUARD:-1}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
